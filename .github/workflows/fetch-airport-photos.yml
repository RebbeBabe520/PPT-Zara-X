# Temporary workflow: downloads the airport photos attached to issue #1
# (github.com/user-attachments is unreachable from the dev sandbox) and
# commits them into assets/. Removed once the photos are in the repo.
name: Fetch airport photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download issue attachments
        run: |
          set -e
          declare -A files=(
            [airport-cn-1]="c00386ad-2bff-4a36-96b2-f3ac79be4472"
            [airport-cn-2]="7b45133b-712b-41aa-a347-dd640ea28770"
            [airport-cn-3]="8a4bd018-c4d9-45fe-9fb4-86e778e50bde"
          )
          for name in "${!files[@]}"; do
            curl -sL --fail -o "/tmp/$name" "https://github.com/user-attachments/assets/${files[$name]}"
            mime=$(file --mime-type -b "/tmp/$name")
            case "$mime" in
              image/jpeg) ext=jpg ;;
              image/png)  ext=png ;;
              image/webp) ext=webp ;;
              *) echo "unexpected type $mime for $name"; exit 1 ;;
            esac
            mv "/tmp/$name" "assets/$name.$ext"
            echo "saved assets/$name.$ext ($mime)"
          done
          ls -la assets/airport-cn-*
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/airport-cn-*
          git commit -m "Add China airport photos from issue #1"
          git push
