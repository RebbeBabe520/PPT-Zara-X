# Temporary workflow: downloads the five international-airport photos from
# issue #2 (attachment hosts are unreachable from the dev sandbox) and
# commits them into assets/. Removed once the photos are in the repo.
name: Fetch airport photos
on:
  push:
    branches: [claude/skill-frontend-slides-install-fk3jg7]
    paths: ['.github/workflows/fetch-airport-photos.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download issue attachments
        run: |
          set -e
          declare -A files=(
            [airport-int-1]="663b90c4-f1d7-48ed-b13e-56424f6759ec"
            [airport-int-2]="0329275f-0ed9-40bc-859a-07954daadbbf"
            [airport-int-3]="35795949-3afa-465c-ab56-9f1af72e524e"
            [airport-int-4]="a153f889-3186-4bb5-baf7-3db6f1b90f76"
            [airport-int-5]="3356c243-3585-4dd7-81c0-f8bd475d627e"
          )
          for name in "${!files[@]}"; do
            curl -sL --fail -o "/tmp/$name" "https://github.com/user-attachments/assets/${files[$name]}"
            mime=$(file --mime-type -b "/tmp/$name")
            case "$mime" in
              image/jpeg) ext=jpg ;;
              image/png)  ext=png ;;
              image/webp) ext=webp ;;
              *) echo "unexpected type $mime for $name"; exit 1 ;;
            esac
            mv "/tmp/$name" "assets/$name.$ext"
            echo "saved assets/$name.$ext ($mime)"
          done
          ls -la assets/airport-int-*
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/airport-int-*
          git commit -m "Add international airport photos from issue #2"
          git push
